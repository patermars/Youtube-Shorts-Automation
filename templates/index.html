<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Shorts Automation</title>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <div class="container">
        <h2>YT Shorts Automation</h2>
        <form id="automation-form">
            <div class="input-field">
                <label for="heading">Heading:</label>
                <input type="text" id="heading" placeholder="Enter heading">
            </div>
            <div class="input-field">
                <label for="comment">Comment:</label>
                <textarea id="comment" placeholder="Enter comment"></textarea>
            </div>
            <div class="input-field">
                <label for="image">Select an Image:</label>
                <input type="file" id="image" accept="image/*">
            </div>
            <button class="generate-btn" id="generate-btn">Generate</button>
        </form>
    </div>
    
    <footer>
        <p>Find this project on <a href="https://github.com/patermars/Youtube-Shorts-Automation" target="_blank">GitHub</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
